project_id = "qxpbnixvjtwckuedlrfj"

[functions.generate-itinerary]
verify_jwt = false

[functions.suggest-block-alternatives]
verify_jwt = false

[functions.restaurant-details]
verify_jwt = false

# Pre-login OTP flows: caller has no JWT yet (they're trying to log in
# or claim a phone). The new sb_publishable_* anon key isn't JWT-format
# and the gateway rejects it before our handler runs. Each function
# does its own rate-limit / phone validation in-handler.
[functions.request-phone-login-otp]
verify_jwt = false

[functions.verify-phone-login-otp]
verify_jwt = false

[functions.claim-otp]
verify_jwt = false

# Authed endpoints that still need verify_jwt=false because the
# sb_publishable_* anon key isn't JWT-format. We extract + validate the
# real user JWT in-handler via supabase-js getUser(token).
[functions.request-phone-change-otp]
verify_jwt = false

[functions.verify-phone-change-otp]
verify_jwt = false

# Survey-side anonymous fan-out: called from app/respond/[tripId].tsx
# when a respondent submits or declines. The handler uses the service
# role for all writes (no user auth needed) — its job is to flip
# is_attending and fire the confirmation SMS. Without verify_jwt=false
# the gateway 401s every call from the survey because the new
# sb_publishable_* anon key isn't JWT-format, leaving is_attending stuck
# at true after a decline (planner roster never shows DECLINED).
[functions.sms-survey-confirmation]
verify_jwt = false
